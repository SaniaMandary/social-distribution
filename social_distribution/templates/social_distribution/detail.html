{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Entry</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/social_distribution/detail.css' %}">
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".like-button").forEach(button => {
        button.addEventListener("click", () => {
            const entryId = button.dataset.entryId;
            const liked = button.dataset.liked === "true";
            const counter = document.getElementById(`likes-count-${entryId}`);

            fetch(`/social_distribution/api/likes/add/${entryId}/`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": getCookie("csrftoken"),
                },
            })
            .then(res => res.json())
            .then(data => {
                if (!data.success) return;

                const current = parseInt(counter.textContent) || 0;

                if (data.liked) {
                    button.textContent = "Unlike";
                    button.dataset.liked = "true";
                    counter.textContent = `${current + 1} likes`;
                } else {
                    button.textContent = "Like";
                    button.dataset.liked = "false";
                    counter.textContent = `${current - 1} likes`;
                }
            });
        });
    });
});

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        document.cookie.split(";").forEach(cookie => {
            const [key, value] = cookie.trim().split("=");
            if (key === name) cookieValue = decodeURIComponent(value);
        });
    }
    return cookieValue;
}
</script>
<body>
    <h1>{{ entry.entry_text }}</h1>
    <p>Posted by {{ entry.belonging_url }}</p>

    <button class="like-button" data-entry-id="{{ entry.id }}" data-liked="{{ entry.user_liked|yesno:'true,false' }}">
    {% if entry.user_liked %}
        Unlike
    {% else %}
        Like
    {% endif %}
    </button>

    <p class="likes-count" id="likes-count-{{ entry.id }}">
        {{ entry.likes_count|default:0 }} likes
    </p>

    {% if request.user.username == entry.belonging_url %}
        <form method="POST" action="{% url 'social_distribution:editentry' entry.id %}">
            {% csrf_token %}
            <input type="text" name="entry_text" placeholder="Edit entry..." value="{{ entry.entry_text }}">
            <input type="submit" value="Edit">
        </form>

        <form method="POST" action="{% url 'social_distribution:deleteentry' entry.id %}">
            {% csrf_token %}
            <input type="submit" value="Delete">
        </form>
    {% endif %}

    <a href="/social_distribution/">Back</a>
</body>
</html>
