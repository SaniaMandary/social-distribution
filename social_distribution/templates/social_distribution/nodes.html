{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nodes</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/social_distribution/generic-page.css' %}">
</head>

<body>
    <h1>All Nodes</h1>
    <ul>
        {% for node, status in nodetuples %}
            <li>
                <a href="{{ node.url }}">{{ node.url }}</a>
                <p>Status: {{ status }}</p>
            </li>
        {% empty %}
            <li>No nodes yet (addable via admin interface).</li>
        {% endfor %}
    </ul>

    <a href="{% url 'social_distribution:index' %}">Back to Home</a>
</body>
</html>
