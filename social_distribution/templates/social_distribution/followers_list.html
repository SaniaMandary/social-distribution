<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Follow Requests</title>
</head>
<body>
    <h1>{{ author.name }}' Followers</h1>

    {% if followers %}
        <ul>
            {% for follow in followers %}
                <li>
                    {{ follow.follower.name }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You have no followers.</p>
    {% endif %}
    <a href="{% url 'social_distribution:index' %}">Back to Home</a>
</body>
</html>
