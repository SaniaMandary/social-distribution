{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Follower Lists</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/social_distribution/followers_list.css' %}">
</head>
<body>
    <h1>{{ author.name }}'s Followers</h1>

    {% if followers %}
        <ul>
            {% for follow in followers %}
                <li>
                    {{ follow.follower.name }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You have no followers.</p>
    {% endif %}
    <a href="{% url 'social_distribution:index' %}">Back to Home</a>
</body>
</html>
