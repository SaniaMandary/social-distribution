{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Following Lists</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/social_distribution/generic-page.css' %}">
</head>
<body>
    <h1>{{ author.name }}'s Following</h1>

    {% if following %}
        <ul>
            {% for follow in following %}
                <li>
                    {{ follow.following.name }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You are not following anyone.</p>
    {% endif %}
    <a href="{% url 'social_distribution:index' %}">Back to Home</a>
</body>
</html>
