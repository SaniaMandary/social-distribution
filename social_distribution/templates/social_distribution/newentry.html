{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>New Entry Page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/social_distribution/newentry.css' %}">
</head>
<body>
    <h1>New Entry</h1>
    <form method="POST" action="{% url 'social_distribution:addentry' %}">
        {% csrf_token %}

         <label for="content_type">Content Type:</label><br>
        {{ form.content_type }}<br><br>
        
        <label for="visibility">Visibility:</label><br>
        {{ form.visibility }}<br><br>

        <label for="entry_text">Entry:</label><br>
         {{ form.entry_text }}<br><br>

        <section id="markdown-section" style="display:none;"> 
            <button id="switch-btn">Preview Markdown</button>
            <h3>Output</h3>
            <p id="markdown-output"></p>
        </section>

        <a href="../">Back</a>
        <input type="submit" value="Submit">
    </form>

    <script src="{% static 'markdown-editor.js' %}"></script>
</body>
</html>
