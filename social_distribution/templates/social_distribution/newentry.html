{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>New Entry Page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/social_distribution/generic-page.css' %}">
</head>
<body>
    <h1>New Entry</h1>
    <form method="POST" action="{% url 'social_distribution:addentry' %}" enctype="multipart/form-data">
        {% csrf_token %}

         <label for="content_type">Content Type:</label><br>
        {{ form.content_type }}<br><br>
        
        <label for="visibility">Visibility:</label><br>
        {{ form.visibility }}<br><br>

        <label for="title">Entry Title:</label><br>
        {{ form.title }}<br><br> 

        <label for="content">Entry:</label><br>
         {{ form.content }}<br><br>

         <label for="image">Image:</label><br>
         {{ form.image }}<br><br>

        <a href="../">Back</a>
        <input type="submit" value="Submit">
    </form>
  </body>
</html>
