<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Change Profile</title>
</head>
<body>
    
    <h1>Edit Profile {{name}}</h1>
    <form method="POST" action="{% url 'social_distribution:editprofile' %}">
        {% csrf_token %}

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{name}}"><br><br>

        <label for="description">Description:</label>
        <input type="text" id="description" name="description" value="{{description}}"><br><br>

        <label for="picture">Picture URL:</label>
        <input type="text" id="picture" name="picture" value="{{picture}}"><br><br>

        <label for="github">GitHub:</label>
        <input type="text" id="github" name="github" value="{{github}}"><br><br>

        <a href="/social_distribution">Back</a>
        <input type="submit" value="Submit">

        <p style="color:orange;">{{ message }}</p>
    </form>

</body>
</html>
